name: Refresh cost map

on:
  schedule:
    - cron: '0 6 * * 1' # weekly, Monday 06:00 UTC
  workflow_dispatch:

concurrency:
  group: refresh-cost-map
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # This job pushes a branch, so it KEEPS the checkout credentials (unlike the
      # read-only workflows that set persist-credentials: false). Pin ref: main so
      # a workflow_dispatch from another branch still refreshes from main and the
      # PR doesn't drag in that branch's unrelated commits.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: main

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Refresh both cost maps from LiteLLM
        run: node scripts/update-cost-map.mjs

      - name: Open a PR if the cost map changed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if git diff --quiet -- src/floe_guard/cost_map.json js/src/cost_map.json; then
            echo "Cost map unchanged — nothing to do."
            exit 0
          fi
          BRANCH="chore/cost-map-refresh-${{ github.run_id }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          # Bump both patch versions in the same commit. version-guard fails any
          # PR that changes package source (both cost maps live under it) without
          # a bump, and a refresh merged unbumped never publishes. Merging stays
          # the gate: a human reviews the price diff before anything ships. Runs
          # only past the "unchanged" early exit, so a quiet week bumps nothing.
          VERSIONS=$(node scripts/bump-patch-versions.mjs)
          git add src/floe_guard/cost_map.json js/src/cost_map.json pyproject.toml js/package.json
          git commit -m "chore: refresh LiteLLM cost map ($VERSIONS)"
          git push origin "$BRANCH"
          gh pr create --base main --head "$BRANCH" \
            --title "chore: refresh LiteLLM cost map" \
            --body "Automated weekly refresh from LiteLLM's public price list, writing both vendored copies (Python + JS). **Review the price diff before merging.** Versions are bumped in the same commit ($VERSIONS) so the refresh publishes on merge. If another open PR bumps the same package, resolve the conflict to a version ABOVE the higher one — never below what main already published. Generated by \`scripts/update-cost-map.mjs\` via the *Refresh cost map* workflow."
